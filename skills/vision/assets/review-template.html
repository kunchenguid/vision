<!doctype html>
<!--
  /vision review board TEMPLATE (ships as skills/vision/assets/review-template.html).

  Agent instructions:
  1. Copy this file and review.css next to each other in the tool's scratch
     area, never into the target repo.
  2. Fill ONLY the four slots marked {{...}} below:
       {{PROJECT}}        - the target repo name (appears in <title> and the header meta)
       {{RUN_NOTE}}       - one short italic note for the header (mode, date, or blank)
       {{DRAFT_MARKDOWN}} - the full latest vision draft at board heading levels
                            (# Vision, ## sections, paragraphs), even when it
                            will be written into STRATEGY.md one level lower
       CARDS              - one object per hypothetical:
                            { id, title, ask, examples, choices, body, tests, why }
                            ask (string), examples (array of 2-3 strings) and
                            choices ({ in, off, cond } of strings) are required
                            on every card. The board names any of the three that
                            is missing or the wrong shape.
  3. Change NOTHING else: no restyling, no layout edits, no extra sections.
     The stylesheet and structure are the /vision house style.
  4. Open with: npx -y lavish-axi <this-file>   then poll for verdicts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/vision review - {{PROJECT}}</title>
<link rel="stylesheet" href="review.css">
</head>
<body class="vr">

<header class="vr-head">
  <div class="vr-title">/vision review</div>
  <div class="vr-meta">{{PROJECT}} · {{RUN_NOTE}}</div>
</header>

<main class="vr-main">

  <section class="vr-draft">
    <span class="vr-label">latest draft · full text</span>
    <article class="vr-doc" id="vr-doc"></article>
  </section>

  <aside class="vr-side">
    <div class="vr-progress"><span>hypotheticals</span><b id="vr-progress"></b></div>
    <div class="vr-stack" id="vr-stack"></div>
    <div class="vr-done" id="vr-done" hidden>
      <h2>Every hypothetical is answered</h2>
      <p class="vr-done-note">Your verdicts are recorded below. Send them back and the agent rebuilds the draft around them for the next round.</p>
      <ul class="vr-ledger" id="vr-ledger"></ul>
      <button type="button" class="vr-send" id="vr-send" onclick="sendBack()">Send my verdicts back</button>
      <p class="vr-sent" id="vr-sent" hidden>Sent - the agent is folding these into the next draft.</p>
    </div>
  </aside>

</main>

<script>
const DRAFT = `{{DRAFT_MARKDOWN}}`;

const CARDS = [
  // {{CARDS}} - one object per hypothetical, in presentation order:
  // { id:'H-1', title:'a short plain label',
  //   ask:'the decision as one plain question',
  //   examples:['what someone would see in case 1', 'case 2', 'the bad case that makes it hard'],
  //   choices:{ in:'what In vision means here', off:'what Off mission means here', cond:'what Conditional means, with an example condition' },
  //   body:'the concrete proposal', tests:'tests: "the principle, quoted from the draft"', why:'both sides, steelmanned' },
];

const VERDICTS = ['In vision','Off mission','Conditional'];

/* ------- no changes below this line ------- */

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>'); }
const out=[]; let para=[];
const flush=()=>{ if(para.length){ out.push('<p>'+para.map(inline).join(' ')+'</p>'); para=[]; } };
for(const line of DRAFT.split('\n')){
  if(line.startsWith('## ')){ flush(); out.push('<h2>'+inline(line.slice(3))+'</h2>'); }
  else if(line.startsWith('# ')){ flush(); out.push('<h1>'+inline(line.slice(2))+'</h1>'); }
  else if(line.trim()===''){ flush(); }
  else para.push(line);
}
flush();
document.getElementById('vr-doc').innerHTML = out.join('\n');

// the plain layer: shape-checked and escaped; a missing or wrong-shaped field never breaks the board,
// and the card says which part is missing
const txt = v => (typeof v === 'string' && v.trim()) ? v : '';
function plainFields(c){
  const choices = (c.choices && typeof c.choices === 'object') ? c.choices : {};
  return {
    ask: txt(c.ask),
    examples: Array.isArray(c.examples) ? c.examples.filter(txt) : [],
    choices,
    hasChoices: Boolean(txt(choices.in) && txt(choices.off) && txt(choices.cond)),
  };
}
// above the proposal: a note naming any missing part, the plain question, the examples
function plainTop(c){
  const { ask, examples, hasChoices } = plainFields(c);
  const gaps = [];
  if (!ask) gaps.push('plain question');
  if (!examples.length) gaps.push('examples');
  if (!hasChoices) gaps.push('what each answer would mean');
  let html = gaps.length ? `<p class="vr-plain-missing">Missing from this card: ${gaps.join(', ')}.</p>` : '';
  if (ask) html += `<p class="vr-card-ask">${inline(ask)}</p>`;
  if (examples.length) html += `<div class="vr-plain"><span class="vr-why-label">For example</span><ul class="vr-examples">${examples.map(e => `<li>${inline(e)}</li>`).join('')}</ul></div>`;
  return html;
}
// below the steelman: what each verdict would mean
function plainChoices(c){
  const { choices, hasChoices } = plainFields(c);
  if (!hasChoices) return '';
  return `<div class="vr-plain"><span class="vr-why-label">What each answer would mean</span><dl class="vr-choices"><dt>In vision</dt><dd>${inline(choices.in)}</dd><dt>Off mission</dt><dd>${inline(choices.off)}</dd><dt>Conditional</dt><dd>${inline(choices.cond)}</dd></dl></div>`;
}

const stack = document.getElementById('vr-stack');
let topIdx = 0; const ledger = [];
stack.innerHTML = CARDS.map((c,i) => `
  <div class="vr-card" id="vrc-${i}">
    <span class="vr-card-id">${c.id} · ${i+1}/${CARDS.length}</span>
    <h3 class="vr-card-title">${inline(String(c.title ?? ''))}</h3>
    ${plainTop(c)}
    <p class="vr-card-body">${c.body}</p>
    <div class="vr-card-tests">${c.tests}</div>
    <div class="vr-why"><span class="vr-why-label">Why the answer is not obvious</span><p>${c.why}</p></div>
    ${plainChoices(c)}
    <div class="vr-verdicts">${VERDICTS.map(v => `<button type="button" aria-pressed="false" onclick="pick(${i}, this)">${v}</button>`).join('')}</div>
    <textarea class="vr-reason" placeholder="reasoning (this is what the vision gets rebuilt from)"></textarea>
    <button type="button" class="vr-commit" disabled onclick="commit(${i})">Record verdict</button>
  </div>`).join('');

function layout(){
  CARDS.forEach((c,i) => {
    const el = document.getElementById('vrc-'+i);
    if (el.classList.contains('vr-gone')) return;
    const depth = i - topIdx;
    if (depth < 0 || depth > 2) { el.hidden = depth !== 0; }
    if (depth >= 0 && depth <= 2) { el.hidden = false; el.dataset.depth = String(depth); }
  });
  const n = Math.min(topIdx+1, CARDS.length);
  document.getElementById('vr-progress').textContent = `${n} / ${CARDS.length}`;
}
function pick(i, btn){
  const card = document.getElementById('vrc-'+i);
  card.querySelectorAll('.vr-verdicts button').forEach(b => b.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true');
  card.querySelector('.vr-commit').disabled = false;
}
function commit(i){
  const card = document.getElementById('vrc-'+i);
  const verdict = card.querySelector('.vr-verdicts button[aria-pressed="true"]')?.textContent;
  if(!verdict) return;
  const notes = card.querySelector('.vr-reason').value.trim();
  ledger.push({ id: CARDS[i].id, verdict, notes });
  if (window.lavish?.queuePrompt) {
    window.lavish.queuePrompt(
      `${CARDS[i].id} (${CARDS[i].title}): ${verdict}.` + (txt(CARDS[i].ask) ? ` Question: ${CARDS[i].ask}` : '') + (notes ? ` Reasoning: ${notes}` : ''),
      { tag:'vision-verdict', queueKey:CARDS[i].id, text:`${CARDS[i].id}: ${verdict}`, element:card, data:{ id:CARDS[i].id, ask:txt(CARDS[i].ask), verdict, notes } });
  }
  card.classList.add('vr-gone');
  topIdx += 1;
  layout();
  setTimeout(() => { card.hidden = true; layout(); }, 360);
  if (topIdx >= CARDS.length) {
    document.getElementById('vr-ledger').innerHTML =
      ledger.map(l => `<li><b>${l.id}</b> ${l.verdict}${l.notes ? ' - ' + esc(l.notes) : ''}</li>`).join('');
    setTimeout(() => { stack.hidden = true; document.getElementById('vr-done').hidden = false; }, 400);
  }
}
function sendBack(){
  const btn = document.getElementById('vr-send');
  if (window.lavish?.queuePrompt) {
    window.lavish.queuePrompt(
      `All ${CARDS.length} hypotheticals are answered. Fold every verdict into the draft and send back the next round.`,
      { tag:'vision-verdict', queueKey:'vision-round-complete', text:'All verdicts recorded - next round',
        element: document.getElementById('vr-done'), data:{ complete:true, verdicts: ledger } });
  }
  window.lavish?.sendQueuedPrompts?.();
  btn.disabled = true;
  btn.textContent = 'Sent for the next round';
  document.getElementById('vr-sent').hidden = false;
}
layout();
</script>
</body>
</html>
