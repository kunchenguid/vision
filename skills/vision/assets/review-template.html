<!doctype html>
<!--
  /vision review board TEMPLATE (ships as skills/vision/assets/review-template.html).

  Agent instructions:
  1. Copy this file and review.css next to each other in the tool's scratch
     area, never into the target repo.
  2. Fill ONLY the four slots marked {{...}} below:
       {{PROJECT}}        - the target repo name (appears in <title> and the header meta)
       {{RUN_NOTE}}       - one short italic note for the header (mode, date, or blank)
       {{DRAFT_MARKDOWN}} - the full latest VISION.md text (markdown: #, ##, paragraphs)
       CARDS              - one object per hypothetical: { id, title, body, tests, why }
  3. Change NOTHING else: no restyling, no layout edits, no extra sections.
     The stylesheet and structure are the /vision house style.
  4. Open with: npx -y lavish-axi <this-file>   then poll for verdicts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/vision review - {{PROJECT}}</title>
<link rel="stylesheet" href="review.css">
</head>
<body class="vr">

<header class="vr-head">
  <div class="vr-title">/vision review</div>
  <div class="vr-meta">{{PROJECT}} · {{RUN_NOTE}}</div>
</header>

<main class="vr-main">

  <section class="vr-draft">
    <span class="vr-label">latest draft · full text</span>
    <article class="vr-doc" id="vr-doc"></article>
  </section>

  <aside class="vr-side">
    <div class="vr-progress"><span>hypotheticals</span><b id="vr-progress"></b></div>
    <div class="vr-stack" id="vr-stack"></div>
    <div class="vr-done" id="vr-done" hidden>
      <h2>Review your queued feedback</h2>
      <p class="vr-done-note">You have reached the end of the cards. Review, edit, or remove verdicts in the Conversation panel before sending.</p>
      <button type="button" class="vr-send" id="vr-send" onclick="sendBack()">Send queued feedback</button>
      <p class="vr-sent" id="vr-sent" role="status" hidden></p>
    </div>
  </aside>

</main>

<script>
const DRAFT = `{{DRAFT_MARKDOWN}}`;

const CARDS = [
  // {{CARDS}} - one object per hypothetical, in presentation order:
  // { id:'H-1', title:'...', body:'the concrete proposal', tests:'tests: "the principle, quoted from the draft"', why:'both sides, steelmanned' },
];

const VERDICTS = ['In vision','Off mission','Conditional'];

/* ------- no changes below this line ------- */

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>'); }
const out=[]; let para=[];
const flush=()=>{ if(para.length){ out.push('<p>'+para.map(inline).join(' ')+'</p>'); para=[]; } };
for(const line of DRAFT.split('\n')){
  if(line.startsWith('## ')){ flush(); out.push('<h2>'+inline(line.slice(3))+'</h2>'); }
  else if(line.startsWith('# ')){ flush(); out.push('<h1>'+inline(line.slice(2))+'</h1>'); }
  else if(line.trim()===''){ flush(); }
  else para.push(line);
}
flush();
document.getElementById('vr-doc').innerHTML = out.join('\n');

const stack = document.getElementById('vr-stack');
let topIdx = 0;
stack.innerHTML = CARDS.map((c,i) => `
  <div class="vr-card" id="vrc-${i}">
    <span class="vr-card-id">${c.id} · ${i+1}/${CARDS.length}</span>
    <h3 class="vr-card-title">${c.title}</h3>
    <p class="vr-card-body">${c.body}</p>
    <div class="vr-card-tests">${c.tests}</div>
    <div class="vr-why"><span class="vr-why-label">Why the answer is not obvious</span><p>${c.why}</p></div>
    <div class="vr-verdicts">${VERDICTS.map(v => `<button type="button" aria-pressed="false" onclick="pick(${i}, this)">${v}</button>`).join('')}</div>
    <textarea class="vr-reason" placeholder="reasoning (this is what the vision gets rebuilt from)"></textarea>
    <button type="button" class="vr-commit" disabled onclick="commit(${i})">Record verdict</button>
  </div>`).join('');

function layout(){
  CARDS.forEach((c,i) => {
    const el = document.getElementById('vrc-'+i);
    if (el.classList.contains('vr-gone')) return;
    const depth = i - topIdx;
    if (depth < 0 || depth > 2) { el.hidden = depth !== 0; }
    if (depth >= 0 && depth <= 2) { el.hidden = false; el.dataset.depth = String(depth); }
  });
  const n = Math.min(topIdx+1, CARDS.length);
  document.getElementById('vr-progress').textContent = `${n} / ${CARDS.length}`;
}
function pick(i, btn){
  if(i !== topIdx) return;
  const card = document.getElementById('vrc-'+i);
  card.querySelectorAll('.vr-verdicts button').forEach(b => b.setAttribute('aria-pressed','false'));
  btn.setAttribute('aria-pressed','true');
  card.querySelector('.vr-commit').disabled = false;
}
function commit(i){
  if(i !== topIdx) return;
  const card = document.getElementById('vrc-'+i);
  const verdict = card.querySelector('.vr-verdicts button[aria-pressed="true"]')?.textContent;
  if(!verdict) return;
  const notes = card.querySelector('.vr-reason').value.trim();
  card.querySelector('.vr-commit').disabled = true;
  if (window.lavish?.queuePrompt) {
    window.lavish.queuePrompt(
      `${CARDS[i].id} (${CARDS[i].title}): ${verdict}.` + (notes ? ` Reasoning: ${notes}` : ''),
      { tag:'vision-verdict', queueKey:CARDS[i].id, text:CARDS[i].id, element:card });
  }
  card.classList.add('vr-gone');
  topIdx += 1;
  layout();
  setTimeout(() => { card.hidden = true; layout(); }, 360);
  if (topIdx >= CARDS.length) {
    setTimeout(() => { stack.hidden = true; document.getElementById('vr-done').hidden = false; }, 400);
  }
}
function sendBack(){
  const feedbackStatus = document.getElementById('vr-sent');
  feedbackStatus.hidden = false;
  if (typeof window.lavish?.sendQueuedPrompts !== 'function') {
    feedbackStatus.textContent = 'Open this board with lavish-axi to send feedback.';
    return;
  }
  window.lavish.sendQueuedPrompts();
  feedbackStatus.textContent = 'Check the Conversation panel for delivery status. An empty queue sends nothing.';
}
layout();
</script>
</body>
</html>
